<!DOCTYPE html>
<html lang="en-NZ">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Coil Tracker">
<title>CH Engineering Coil Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #17191B;
  --steel: #2B3034;
  --zinc-50: #EEF0F1;
  --zinc-100: #E1E5E7;
  --zinc-300: #C2C9CD;
  --zinc-500: #6B757C;
  --white: #FFFFFF;
  --yellow: #FEE300;
  --yellow-press: #E8CF00;
  --red: #B3261E;
  --green: #1D7643;
  --display: 'Barlow Condensed', 'Arial Narrow', 'Roboto Condensed', Arial, sans-serif;
  --body: 'Barlow', system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
  --dock: 92px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  font-family: var(--body); font-size: 16px; line-height: 1.4; color: var(--ink);
  background: var(--zinc-50); -webkit-tap-highlight-color: transparent;
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid #0B63CE; outline-offset: 2px; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ── buttons ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 44px; padding: 0 16px; border-radius: 6px; border: 2px solid var(--ink);
  background: var(--white); font-family: var(--display); font-weight: 600; font-size: 18px; letter-spacing: .01em;
  text-decoration: none; color: var(--ink); white-space: nowrap;
}
.btn:active { transform: translateY(1px); }
.btn.yellow { background: var(--yellow); border-color: var(--yellow); }
.btn.yellow:active { background: var(--yellow-press); }
.btn.dark { background: var(--ink); color: var(--white); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--red); border-color: var(--red); }
.btn.small { min-height: 36px; font-size: 16px; padding: 0 12px; border-width: 1.5px; }
.btn.big { min-height: 58px; font-size: 22px; padding: 0 22px; }
.btn.block { width: 100%; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.btn svg { width: 22px; height: 22px; flex: none; }
.link { background: none; border: 0; padding: 0; color: #0B63CE; text-decoration: underline; font-weight: 600; }

/* ── login ── */
.login {
  min-height: 100vh; min-height: 100dvh; background: var(--white); color: var(--ink);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: calc(32px + var(--safe-t)) 24px calc(32px + var(--safe-b));
}
.login img { width: min(320px, 82vw); height: auto; margin-bottom: 8px; }
.login h1 { font-family: var(--display); font-weight: 600; font-size: 24px; margin: 6px 0 28px; color: var(--zinc-500); }
.login form { width: min(360px, 100%); display: grid; gap: 14px; }
.login label { font-weight: 600; font-size: 15px; color: var(--ink); display: grid; gap: 6px; }
.login select, .login input {
  height: 56px; border-radius: 6px; border: 2px solid var(--zinc-300); background: var(--white); color: var(--ink);
  padding: 0 14px; font-size: 20px; width: 100%;
}
.login input.pin { font-family: var(--display); font-size: 30px; letter-spacing: .4em; text-align: center; }
.login .err { color: var(--red); min-height: 22px; font-weight: 600; }
.demo-note { margin-top: 24px; max-width: 360px; font-size: 14px; color: var(--zinc-500); text-align: center; background: var(--zinc-50); border-left: 4px solid var(--yellow); padding: 10px 12px; border-radius: 6px; }
.demo-note b { color: var(--ink); }

/* ── header ── */
header.top {
  position: sticky; top: 0; z-index: 20; background: var(--white); color: var(--ink); border-bottom: 1px solid var(--zinc-100);
  padding: calc(10px + var(--safe-t)) 16px 0;
}
.top-row { display: flex; align-items: center; gap: 12px; max-width: 1040px; margin: 0 auto; padding-bottom: 10px; }
.top-row img { height: 34px; width: auto; }
@media (min-width: 760px) { .top-row img { height: 40px; } }
.top-row .who { margin-left: auto; text-align: right; font-size: 14px; line-height: 1.2; }
.top-row .who b { display: block; font-size: 15px; }
.top-row .who span { color: var(--zinc-500); }
.icon-btn {
  width: 44px; height: 44px; border-radius: 6px; border: 0; background: var(--zinc-100); color: var(--ink);
  display: grid; place-items: center; flex: none;
}
.icon-btn svg { width: 22px; height: 22px; }
.icon-btn.spin svg { animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
nav.tabs { display: flex; gap: 4px; max-width: 1040px; margin: 0 auto; overflow-x: auto; scrollbar-width: none; }
nav.tabs button {
  border: 0; background: none; color: var(--zinc-500); padding: 10px 14px 12px; font-family: var(--display);
  font-weight: 600; font-size: 19px; border-bottom: 4px solid transparent; white-space: nowrap;
}
nav.tabs button[aria-current="page"] { color: var(--ink); border-bottom-color: var(--yellow); }
.demo-banner { background: var(--yellow); color: var(--ink); text-align: center; font-size: 14px; font-weight: 600; padding: 6px 12px; }

main { max-width: 1040px; margin: 0 auto; padding: 18px 16px calc(var(--dock) + 40px + var(--safe-b)); }
main.no-dock { padding-bottom: calc(40px + var(--safe-b)); }
h2.sec { font-family: var(--display); font-weight: 700; font-size: 30px; line-height: 1.05; margin: 0; }
.sec-sub { color: var(--zinc-500); font-weight: 500; margin: 2px 0 14px; }

/* ── shed grid ── */
.shed { background: var(--white); border: 1px solid var(--zinc-100); border-radius: 8px; padding: 16px; margin-bottom: 22px; }
.grid { display: grid; grid-template-columns: 58px repeat(var(--cols), 1fr); gap: 4px; }
.grid .hd { font-family: var(--display); font-weight: 600; font-size: 15px; color: var(--zinc-500); padding: 2px 4px; align-self: end; }
.grid .rh { font-family: var(--display); font-weight: 700; font-size: 20px; align-self: center; line-height: 1; }
.grid .rh small, .grid .hd small { font-size: 12px; font-weight: 600; color: var(--zinc-500); }
.cell {
  border: 2px solid var(--zinc-100); background: var(--zinc-50); border-radius: 6px; min-height: 62px;
  padding: 6px 8px; text-align: left; display: flex; flex-direction: column; justify-content: center;
}
.cell b { font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1; }
.cell span { font-size: 12.5px; color: var(--zinc-500); font-weight: 500; }
.cell.zero b { color: var(--zinc-300); }
.cell.low { border-color: #F2B8B4; }
.cell[aria-pressed="true"] { border-color: var(--ink); background: var(--yellow); }
.cell[aria-pressed="true"] span { color: var(--ink); }
.grid-foot { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; color: var(--zinc-500); }

/* ── list controls ── */
.controls { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 12px; }
.seg { display: inline-flex; background: var(--zinc-100); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button {
  border: 0; background: none; border-radius: 6px; min-height: 40px; padding: 0 12px;
  font-weight: 600; font-size: 15px; color: var(--zinc-500);
}
.seg button[aria-pressed="true"] { background: var(--white); color: var(--ink); box-shadow: 0 1px 0 var(--zinc-300); }
.seg button em { font-style: normal; font-family: var(--display); font-weight: 700; font-size: 17px; margin-left: 4px; }
.search { flex: 1 1 220px; position: relative; }
.search input {
  width: 100%; height: 46px; border: 2px solid var(--zinc-100); border-radius: 8px; background: var(--white);
  padding: 0 14px 0 40px; font-size: 16px;
}
.search svg { position: absolute; left: 12px; top: 13px; width: 20px; height: 20px; color: var(--zinc-500); }
.filter-chip {
  display: inline-flex; align-items: center; gap: 8px; background: var(--ink); color: var(--white); border: 0;
  border-radius: 99px; min-height: 36px; padding: 0 8px 0 14px; font-weight: 600; font-size: 14px;
}
.filter-chip i { font-style: normal; background: var(--steel); border-radius: 99px; width: 24px; height: 24px; display: grid; place-items: center; }

/* ── coil list ── */
ul.coils { list-style: none; margin: 0; padding: 0; background: var(--white); border: 1px solid var(--zinc-100); border-radius: 8px; }
.coil {
  display: grid; grid-template-columns: 1fr auto; gap: 4px 14px; padding: 14px 16px;
  border-bottom: 1px solid var(--zinc-100); position: relative;
}
.coil:last-child { border-bottom: 0; }
.coil::before { content: ''; position: absolute; left: 0; top: 12px; bottom: 12px; width: 4px; border-radius: 0 3px 3px 0; background: var(--yellow); }
.coil.used::before { background: var(--zinc-300); }
.coil-id { font-family: var(--display); font-weight: 700; font-size: 24px; line-height: 1.05; word-break: break-all; }
.coil.used .coil-id { color: var(--zinc-500); }
.coil-sup { font-size: 14px; color: var(--zinc-500); font-weight: 500; }
.tag { display: inline-block; font-size: 12px; font-weight: 700; padding: 1px 7px; border-radius: 4px; margin-left: 6px; vertical-align: 1px; }
.tag.cons { background: var(--yellow); color: var(--ink); }
.tag.nolabel { background: var(--ink); color: var(--white); }
.tag.out { background: var(--zinc-100); color: var(--zinc-500); }
.coil-spec { text-align: right; font-family: var(--display); font-weight: 700; font-size: 22px; line-height: 1.05; white-space: nowrap; }
.coil-spec small { font-size: 13px; font-weight: 600; color: var(--zinc-500); margin-left: 1px; }
.coil-spec .x { color: var(--zinc-300); margin: 0 3px; font-weight: 500; }
.coil-kg { text-align: right; font-weight: 600; font-size: 15px; }
.coil-meta { grid-column: 1 / -1; font-size: 13.5px; color: var(--zinc-500); }
.coil-meta b { color: var(--ink); font-weight: 600; }
.coil-actions { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.empty { padding: 34px 20px; text-align: center; color: var(--zinc-500); }
.empty b { display: block; color: var(--ink); font-family: var(--display); font-size: 22px; margin-bottom: 4px; }

@media (min-width: 760px) {
  .coil { grid-template-columns: minmax(180px, 1.4fr) 170px 110px minmax(160px, 1.2fr) auto; align-items: center; }
  .coil-meta { grid-column: auto; }
  .coil-actions { grid-column: auto; margin: 0; justify-content: flex-end; }
  .coil-kg { text-align: right; }
}

/* ── dock with the roofline ── */
.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--white);
  padding: 10px 16px calc(12px + var(--safe-b));
}
.dock::before, .dock::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 100%; height: 22px; pointer-events: none;
}
.dock::before { background: var(--white); clip-path: polygon(0 100%, 50% 0, 100% 100%); filter: drop-shadow(0 -1px 0 var(--zinc-300)); }
.dock::after { background: var(--yellow); clip-path: polygon(0 100%, 50% 0, 100% 100%, 100% 100%, 50% 7px, 0 100%); }
.dock-in { max-width: 1040px; margin: 0 auto; display: flex; gap: 10px; }
.dock .btn.big { flex: 1; }
.dock .btn.signin { flex: 0 1 220px; background: var(--white); color: var(--ink); border-color: var(--ink); }
.dock svg { width: 26px; height: 26px; }

/* ── sheets (modals) ── */
.overlay { position: fixed; inset: 0; z-index: 50; background: rgba(23, 25, 27, .55); display: flex; align-items: flex-end; justify-content: center; }
.sheet {
  background: var(--white); width: 100%; max-width: 620px; max-height: calc(100% - 24px - var(--safe-t)); overflow: auto;
  border-radius: 14px 14px 0 0; padding: 18px 18px calc(22px + var(--safe-b)); animation: up .18s ease-out;
}
@media (min-width: 760px) {
  .overlay { align-items: center; padding: 24px; }
  .sheet { border-radius: 12px; max-height: calc(100% - 48px); }
}
@keyframes up { from { transform: translateY(24px); opacity: .6; } }
@media (prefers-reduced-motion: reduce) { .sheet { animation: none; } .icon-btn.spin svg { animation: none; } }
.sheet-head { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }
.sheet-head h3 { font-family: var(--display); font-weight: 700; font-size: 28px; margin: 0; flex: 1; line-height: 1.05; }
.sheet-head .icon-btn { background: var(--zinc-100); color: var(--ink); }

#reader, .reader { width: 100%; border-radius: 10px; overflow: hidden; background: var(--zinc-100); min-height: 220px; position: relative; }
#reader video, .reader video { width: 100% !important; display: block; }
.cam-msg { padding: 60px 20px; text-align: center; color: var(--zinc-500); font-weight: 500; }
.manual { display: flex; gap: 8px; margin-top: 14px; }
.manual input {
  flex: 1; min-width: 0; height: 52px; border-radius: 6px; border: 2px solid var(--zinc-300); background: var(--white); color: var(--ink);
  padding: 0 14px; font-family: var(--display); font-size: 22px; font-weight: 600; letter-spacing: .02em;
}
.scan-sheet label.lbl { display: block; margin-top: 16px; font-weight: 600; color: var(--ink); font-size: 15px; }
.result { margin-top: 16px; background: var(--zinc-50); color: var(--ink); border: 1px solid var(--zinc-100); border-radius: 10px; padding: 16px; }
.result .rid { font-family: var(--display); font-weight: 700; font-size: 34px; line-height: 1; }
.result .rspec { font-family: var(--display); font-weight: 600; font-size: 22px; margin: 4px 0; }
.result p { margin: 6px 0 14px; color: var(--zinc-500); }
.result.warn { border-left: 6px solid var(--red); }
.result.done { border-left: 6px solid var(--green); }
.result .choice { width: 100%; text-align: left; margin-top: 8px; }
.done-mark { font-family: var(--display); font-weight: 700; font-size: 22px; color: var(--green); }

/* ── forms ── */
.form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; }
.field > span, .fieldset-label { font-weight: 600; font-size: 15px; }
.field input, .field select, .field textarea {
  height: 50px; border-radius: 6px; border: 2px solid var(--zinc-300); background: var(--white); padding: 0 12px; font-size: 17px; width: 100%;
}
.field textarea { height: 70px; padding: 10px 12px; resize: vertical; }
.field input.big-id { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: .02em; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.with-btn { display: flex; gap: 8px; }
.with-btn input { flex: 1; min-width: 0; }
.chips { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 8px; max-width: 460px; }
.chips label { position: relative; }
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips span {
  display: flex; align-items: center; justify-content: center; min-height: 52px; padding: 0 6px; border: 2px solid var(--zinc-300); border-radius: 6px;
  font-family: var(--display); font-weight: 700; font-size: 21px; background: var(--white);
}
.chips span small { font-size: 13px; color: var(--zinc-500); margin-left: 3px; font-weight: 600; }
.chips input:checked + span { background: var(--yellow); border-color: var(--ink); }
.chips input:focus-visible + span { outline: 3px solid #0B63CE; outline-offset: 2px; }
.toggle { display: flex; align-items: center; gap: 12px; font-weight: 600; min-height: 44px; }
.toggle input { width: 24px; height: 24px; accent-color: var(--ink); }
.form-err { color: var(--red); font-weight: 600; min-height: 1px; }
.form-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.form-actions .btn { flex: 1; }
.inline-add { background: var(--zinc-50); border-radius: 8px; padding: 12px; display: grid; gap: 10px; }

/* ── tables / admin pages ── */
.panel { background: var(--white); border: 1px solid var(--zinc-100); border-radius: 8px; padding: 16px; margin-bottom: 18px; }
.panel h3 { font-family: var(--display); font-weight: 700; font-size: 23px; margin: 0 0 10px; }
.stats { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
.stat { flex: 1 1 150px; background: var(--white); border: 1px solid var(--zinc-100); border-left: 5px solid var(--yellow); border-radius: 8px; padding: 12px 14px; }
.stat b { display: block; font-family: var(--display); font-weight: 700; font-size: 32px; line-height: 1.05; }
.stat span { color: var(--zinc-500); font-weight: 500; font-size: 14px; }
.cons-block { border-left: 5px solid var(--yellow); }
.cons-nums { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.cons-nums div { background: var(--zinc-50); border-radius: 6px; padding: 10px 12px; }
.cons-nums b { display: block; font-family: var(--display); font-size: 28px; font-weight: 700; line-height: 1.05; }
.cons-nums span { font-size: 14px; color: var(--zinc-500); font-weight: 500; }
.tbl-wrap { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-size: 13px; color: var(--zinc-500); font-weight: 600; border-bottom: 2px solid var(--ink); padding: 6px 8px; white-space: nowrap; }
.tbl td { border-bottom: 1px solid var(--zinc-100); padding: 8px; white-space: nowrap; }
.tbl td.n, .tbl th.n { text-align: right; }
.tbl tr.sum td { font-weight: 700; border-top: 2px solid var(--ink); border-bottom: 0; }
.tbl td b { font-family: var(--display); font-size: 18px; }
.tbl .cell-sub { font-size: 13px; color: var(--zinc-500); }
.month-pick { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 18px; }
.month-pick select { height: 48px; border-radius: 6px; border: 2px solid var(--ink); background: var(--white); padding: 0 12px; font-family: var(--display); font-weight: 700; font-size: 22px; }
.files li { margin: 4px 0; }
.files { padding-left: 18px; margin: 0; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding: 12px 0; border-bottom: 1px solid var(--zinc-100); }
.people li:last-child { border-bottom: 0; }
.people .nm { font-family: var(--display); font-weight: 700; font-size: 22px; flex: 1 1 140px; }
.people .nm small { font-family: var(--body); font-size: 13px; color: var(--zinc-500); font-weight: 500; margin-left: 6px; }
.people .acts { display: flex; gap: 8px; flex-wrap: wrap; }
.people li.inactive .nm { color: var(--zinc-300); }
.add-row { display: grid; grid-template-columns: 1fr 120px 130px auto; gap: 10px; align-items: end; }
@media (max-width: 640px) { .add-row { grid-template-columns: 1fr 1fr; } .add-row .btn { grid-column: 1 / -1; } }

/* ── toast ── */
.toast {
  position: fixed; left: 50%; bottom: calc(var(--dock) + 34px + var(--safe-b)); transform: translateX(-50%); z-index: 80;
  background: var(--ink); color: var(--white); border-radius: 8px; padding: 12px 16px; font-weight: 600;
  display: flex; gap: 14px; align-items: center; max-width: calc(100% - 32px); box-shadow: 0 6px 24px rgba(0,0,0,.25);
}
.toast.err { background: var(--red); }
.toast button { background: none; border: 0; color: var(--yellow); font-weight: 700; text-decoration: underline; padding: 0; }
.no-dock-page .toast { bottom: calc(24px + var(--safe-b)); }
.loading { padding: 60px 20px; text-align: center; color: var(--zinc-500); font-weight: 500; }
</style>
</head>
<body>
<div id="app"><div class="loading">Loading…</div></div>
<div id="overlay-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
'use strict';
/* =====================================================================
   CH Engineering Coil Tracker — front end
   ===================================================================== */
const CFG = Object.assign({ API_URL: '', WIDTHS: [92, 135, 166, 188], THICKNESSES: [0.55, 0.75, 0.95, 1.15], DEFAULT_GRADE: 'G550' }, window.COIL_CONFIG || {});
const DEMO = !CFG.API_URL;

// ───────── helpers ─────────
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const normId = s => String(s || '').replace(/\s+/g, '').toUpperCase();
const normKey = s => String(s || '').trim().replace(/\s+/g, ' ').toUpperCase();
const kg = n => Math.round(Number(n) || 0).toLocaleString('en-NZ') + ' kg';
const bmt = t => Number(t).toFixed(2);
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');
const monthKey = d => d.toLocaleDateString('en-CA', { timeZone: 'Pacific/Auckland', year: 'numeric', month: '2-digit' }).slice(0, 7);
// The month a used coil counts in: a pushed-to-next-month override if set, otherwise the month it was scanned out
const effMonth = c => c.countsIn || (c.scannedOutAt ? monthKey(new Date(c.scannedOutAt)) : '');
const nextMonthKey = k => { const [y, m] = k.split('-').map(Number); return m === 12 ? (y + 1) + '-01' : y + '-' + String(m + 1).padStart(2, '0'); };
const monthLong = k => new Date(k + '-15T00:00:00').toLocaleDateString('en-NZ', { month: 'long' });
function fmtDate(iso, withTime) {
  if (!iso) return '';
  const d = new Date(iso);
  const sameYear = d.getFullYear() === new Date().getFullYear();
  const opts = { day: 'numeric', month: 'short', timeZone: 'Pacific/Auckland' };
  if (!sameYear) opts.year = 'numeric';
  let s = d.toLocaleDateString('en-NZ', opts);
  if (withTime) s += ', ' + d.toLocaleTimeString('en-NZ', { hour: 'numeric', minute: '2-digit', timeZone: 'Pacific/Auckland' });
  return s;
}
const store = {
  get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { /* storage blocked */ } },
  del(k) { try { localStorage.removeItem(k); } catch (e) { /* storage blocked */ } },
};
const isDesk = () => window.matchMedia('(pointer: fine)').matches;

// ───────── state ─────────
const session = store.get('chct_session') || {};
const S = {
  token: session.token || '', user: session.user || null,
  coils: [], suppliers: [], month: monthKey(new Date()),
  tab: 'stock', filter: 'in', search: '', cell: null,
  crew: null, months: null, report: null, reportMonth: null,
  loading: false, lastLoad: 0,
};
const isAdmin = () => S.user && S.user.role === 'Admin';

// ───────── API ─────────
async function api(action, data = {}) {
  let out;
  if (DEMO) {
    out = demoApi(action, Object.assign({ token: S.token }, data));
    await new Promise(r => setTimeout(r, 150));
  } else {
    let res;
    try {
      res = await fetch(CFG.API_URL, {
        method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(Object.assign({ action, token: S.token }, data)),
      });
      out = await res.json();
    } catch (e) {
      throw new Error('Can\'t reach the server. Check your signal and try again.');
    }
  }
  if (!out.ok) {
    if (out.code === 'signed_out') { signOut(true); }
    const e = new Error(out.error || 'Something went wrong.');
    e.code = out.code;
    throw e;
  }
  return out.data;
}

// ───────── toast ─────────
let toastTimer;
function toast(msg, opts = {}) {
  const root = $('#toast-root');
  clearTimeout(toastTimer);
  root.innerHTML = `<div class="toast ${opts.error ? 'err' : ''}" role="status"><span>${esc(msg)}</span>${opts.action ? `<button type="button" id="toast-act">${esc(opts.action)}</button>` : ''}</div>`;
  if (opts.action) $('#toast-act').onclick = () => { root.innerHTML = ''; opts.onAction(); };
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, opts.ms || (opts.action ? 7000 : 3500));
}

// ───────── session ─────────
function signOut(expired) {
  store.del('chct_session');
  S.token = ''; S.user = null; S.coils = []; S.crew = null; S.months = null; S.report = null;
  closeSheet();
  renderLogin(expired ? 'You\'ve been signed out. Sign in again.' : '');
}

async function renderLogin(msg) {
  document.body.classList.add('no-dock-page');
  $('#app').innerHTML = `
    <section class="login">
      <img src="${LOGO}" alt="CH Engineering, steel framed homes">
      <h1>Coil tracker</h1>
      <form id="login-form" autocomplete="off">
        <label>Your name
          <select id="login-name" required><option value="">Loading crew…</option></select>
        </label>
        <label>PIN
          <input id="login-pin" class="pin" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="6" required autocomplete="off">
        </label>
        <div class="err" id="login-err">${esc(msg || '')}</div>
        <button class="btn yellow big block" type="submit">Sign in</button>
      </form>
      ${DEMO ? `<p class="demo-note"><b>Demo mode.</b> Not connected to Google yet, so sample coils are saved on this device only. Sign in as <b>Demo Admin</b> with PIN <b>1234</b>, or <b>Demo Worker</b> with PIN <b>0000</b>.</p>` : ''}
    </section>`;
  const sel = $('#login-name');
  try {
    const names = await api('crewNames');
    const last = store.get('chct_lastname');
    sel.innerHTML = '<option value="">Pick your name</option>' + names.map(n => `<option ${n === last ? 'selected' : ''}>${esc(n)}</option>`).join('');
  } catch (e) {
    sel.innerHTML = '<option value="">Couldn\'t load names</option>';
    $('#login-err').textContent = e.message;
  }
  $('#login-form').onsubmit = async ev => {
    ev.preventDefault();
    const btn = ev.target.querySelector('button');
    const name = sel.value, pin = $('#login-pin').value.trim();
    if (!name) { $('#login-err').textContent = 'Pick your name first.'; return; }
    if (!/^\d{4,6}$/.test(pin)) { $('#login-err').textContent = 'PINs are 4 to 6 numbers.'; return; }
    btn.disabled = true; btn.textContent = 'Signing in…';
    try {
      const r = await api('login', { name, pin });
      S.token = r.token; S.user = r.user;
      store.set('chct_session', { token: r.token, user: r.user });
      store.set('chct_lastname', name);
      S.tab = 'stock'; S.filter = 'in';
      await loadAll();
      renderApp();
    } catch (e) {
      $('#login-err').textContent = e.message;
      $('#login-pin').value = '';
      btn.disabled = false; btn.textContent = 'Sign in';
    }
  };
}

// ───────── data ─────────
async function loadAll(quiet) {
  S.loading = true; updateRefresh();
  try {
    const d = await api('bootstrap');
    S.user = d.user; S.coils = d.coils; S.suppliers = d.suppliers; S.month = d.month;
    S.lastLoad = Date.now();
    store.set('chct_session', { token: S.token, user: S.user });
  } catch (e) {
    if (!quiet && e.code !== 'signed_out') toast(e.message, { error: true });
    if (e.code === 'signed_out') throw e;
  } finally {
    S.loading = false; updateRefresh();
  }
}
function upsertCoil(c) {
  const i = S.coils.findIndex(x => x.key === c.key);
  if (i >= 0) S.coils[i] = c; else S.coils.unshift(c);
}
function updateRefresh() { const b = $('#refresh-btn'); if (b) b.classList.toggle('spin', S.loading); }

    ${S.tab === 'stock' ? `
    <div class="dock"><div class="dock-in">
      ${isAdmin() ? `<button class="btn big signin" type="button" id="signin-btn">${ICON.plus}<span>Sign in coil</span></button>` : ''}
      <button class="btn yellow big" type="button" id="scan-btn">${ICON.scan}<span>Scan out coil</span></button>
    </div></div>` : ''}`;
  $('#refresh-btn').onclick = () => refreshCurrent();
  $('#signout-btn').onclick = () => confirmSheet('Sign out?', 'You\'ll need your PIN to sign back in.', 'Sign out', () => signOut());
  document.querySelectorAll('[data-tab]').forEach(b => b.onclick = () => { S.tab = b.dataset.tab; renderApp(); });
  if ($('#scan-btn')) $('#scan-btn').onclick = () => openScan();
  if ($('#signin-btn')) $('#signin-btn').onclick = () => openCoilForm();
  updateRefresh();
  renderTab();
}

function renderTab() {
  if (S.tab === 'stock') renderStock();
  else if (S.tab === 'monthly') renderMonthly();
  else if (S.tab === 'crew') renderCrew();
  else if (S.tab === 'suppliers') renderSuppliers();
}

async function refreshCurrent() {
  try {
    await loadAll();
    if (S.tab === 'monthly') { S.months = null; S.report = null; }
    if (S.tab === 'crew') S.crew = null;
    renderTab();
  } catch (e) { /* handled */ }
}

// ───────── stock tab ─────────
function renderStock() {
  const inStock = S.coils.filter(c => c.status === 'In stock');
  const used = S.coils.filter(c => c.status === 'Used');
  const unlabelled = inStock.filter(c => !c.labelsPrinted);
  const widths = [...new Set(CFG.WIDTHS.concat(inStock.map(c => c.width)))].sort((a, b) => a - b);
  const thicks = [...new Set(CFG.THICKNESSES.concat(inStock.map(c => c.thickness)))].sort((a, b) => a - b);
  const monthName = new Date().toLocaleDateString('en-NZ', { month: 'long', timeZone: 'Pacific/Auckland' });

  let gridHtml = `<div class="hd"></div>` + thicks.map(t => `<div class="hd">${bmt(t)}<small> BMT</small></div>`).join('');
  widths.forEach(w => {
    gridHtml += `<div class="rh">${w}<small>mm</small></div>`;
    thicks.forEach(t => {
      const list = inStock.filter(c => c.width === w && Number(c.thickness) === Number(t));
      const on = S.cell && S.cell.w === w && S.cell.t === t;
      gridHtml += `<button type="button" class="cell ${list.length ? '' : 'zero'}" data-cell="${w}|${t}" aria-pressed="${on}" aria-label="${w} mm by ${bmt(t)} BMT: ${plural(list.length, 'coil')}">
        <b>${list.length}</b><span>${list.length ? kg(list.reduce((s, c) => s + c.weight, 0)) : 'none'}</span></button>`;
    });
  });

  let list = S.filter === 'used' ? used : S.filter === 'label' ? unlabelled : inStock;
  if (S.cell) list = list.filter(c => c.width === S.cell.w && Number(c.thickness) === Number(S.cell.t));
  const q = S.search.trim().toLowerCase();
  if (q) list = list.filter(c => [c.coilId, c.supplier, c.width + '', bmt(c.thickness), c.grade, c.notes, c.scannedOutBy].join(' ').toLowerCase().includes(q));
  list = list.slice().sort((a, b) => S.filter === 'used'
    ? (b.scannedOutAt || '').localeCompare(a.scannedOutAt || '')
    : (b.signedInAt || '').localeCompare(a.signedInAt || ''));

  $('#main').innerHTML = `
    <section class="shed" aria-labelledby="shed-h">
      <h2 class="sec" id="shed-h">In the shed</h2>
      <p class="sec-sub">${plural(inStock.length, 'coil')}, ${kg(inStock.reduce((s, c) => s + c.weight, 0))}. Tap a size to see those coils.</p>
      <div class="grid" style="--cols:${thicks.length}">${gridHtml}</div>
      <div class="grid-foot"><span>Width down the side, thickness across the top.</span><span>${plural(used.length, 'coil')} used in ${esc(monthName)}</span></div>
    </section>

    <div class="controls">
      <div class="seg" role="group" aria-label="Show">
        <button type="button" data-filter="in" aria-pressed="${S.filter === 'in'}">In stock<em>${inStock.length}</em></button>
        <button type="button" data-filter="used" aria-pressed="${S.filter === 'used'}">Used in ${esc(monthName)}<em>${used.length}</em></button>
        ${isAdmin() ? `<button type="button" data-filter="label" aria-pressed="${S.filter === 'label'}">Needs label<em>${unlabelled.length}</em></button>` : ''}
      </div>
      <div class="search">${ICON.search}<input id="search" type="search" placeholder="Search coil ID or supplier" value="${esc(S.search)}" aria-label="Search coils"></div>
    </div>
    ${S.cell ? `<p><button type="button" class="filter-chip" id="clear-cell">${S.cell.w} mm × ${bmt(S.cell.t)} BMT <i aria-hidden="true">×</i><span class="sr">Clear size filter</span></button></p>` : ''}
    ${S.filter === 'label' && unlabelled.length && isAdmin() ? `<p><button type="button" class="btn dark" id="print-all">Print all ${plural(unlabelled.length, 'label')}</button></p>` : ''}
    ${list.length ? `<ul class="coils">${list.map(coilRow).join('')}</ul>` : emptyList()}
  `;

  document.querySelectorAll('[data-cell]').forEach(b => b.onclick = () => {
    const [w, t] = b.dataset.cell.split('|').map(Number);
    S.cell = S.cell && S.cell.w === w && S.cell.t === t ? null : { w, t };
    if (S.cell && S.filter === 'used') S.filter = 'in';
    renderStock();
  });
  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => { S.filter = b.dataset.filter; renderStock(); });
  const s = $('#search');
  s.oninput = () => { S.search = s.value; const pos = s.selectionStart; renderStock(); const n = $('#search'); n.focus(); n.setSelectionRange(pos, pos); };
  if ($('#clear-cell')) $('#clear-cell').onclick = () => { S.cell = null; renderStock(); };
  if ($('#print-all')) $('#print-all').onclick = () => printLabels(unlabelled);
  document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => coilAction(b.dataset.act, b.dataset.key));
}

function emptyList() {
  if (S.search || S.cell) return `<div class="empty"><b>No coils match</b>Try a different search, or clear the size filter.</div>`;
  if (S.filter === 'used') return `<div class="empty"><b>Nothing scanned out yet this month</b>Coils show here once they've been scanned out.</div>`;
  if (S.filter === 'label') return `<div class="empty"><b>Every coil has a label</b>New coils signed in on a phone will wait here for printing.</div>`;
  return `<div class="empty"><b>The shed is empty</b>${isAdmin() ? 'Use Sign in coil to add coils as they come off the truck.' : 'An admin signs coils in when they arrive.'}</div>`;
}

function coilRow(c) {
  const used = c.status === 'Used';
  const meta = used
    ? `Scanned out <b>${fmtDate(c.scannedOutAt, true)}</b> by <b>${esc(c.scannedOutBy)}</b>`
    : `Signed in ${fmtDate(c.signedInAt)} by ${esc(c.signedInBy)}${c.grade && c.grade !== CFG.DEFAULT_GRADE ? ', grade ' + esc(c.grade) : ''}`;
  let acts = '';
  if (isAdmin()) {
    acts = used
      ? `<button class="btn small" type="button" data-act="return" data-key="${esc(c.key)}">Return to stock</button>`
      : `<button class="btn small" type="button" data-act="print" data-key="${esc(c.key)}">${c.labelsPrinted ? 'Reprint label' : 'Print label'}</button>
         <button class="btn small ghost" type="button" data-act="edit" data-key="${esc(c.key)}">Edit</button>`;
  }
  return `<li class="coil ${used ? 'used' : ''}">
    <div><div class="coil-id">${esc(c.coilId)}</div>
      <div class="coil-sup">${esc(c.supplier)}${c.consignment ? '<span class="tag cons">Consignment</span>' : ''}${!used && !c.labelsPrinted && isAdmin() ? '<span class="tag nolabel">No label</span>' : ''}${used ? '<span class="tag out">Used</span>' : ''}</div></div>
    <div><div class="coil-spec">${c.width}<small>mm</small><span class="x">×</span>${bmt(c.thickness)}<small>BMT</small></div>
      <div class="coil-kg">${kg(c.weight)}</div></div>
    <div class="coil-meta">${meta}${c.notes ? `<br>${esc(c.notes)}` : ''}</div>
    ${acts ? `<div class="coil-actions">${acts}</div>` : ''}
  </li>`;
}

function coilAction(act, key) {
  const c = S.coils.find(x => x.key === key);
  if (!c) return;
  if (act === 'print') printLabels([c]);
  if (act === 'edit') openCoilForm(c);
  if (act === 'return') {
    confirmSheet('Return coil ' + c.coilId + ' to stock?', 'Use this if it was scanned out by mistake. It goes back on the stock list and comes off this month\'s usage.', 'Return to stock', async () => {
      const upd = await api('returnToStock', { key });
      upsertCoil(upd); renderStock(); toast('Coil ' + upd.coilId + ' returned to stock.');
    });
  }
}

// ───────── sheets (modals) ─────────
let sheetCleanup = null;
function openSheet(html, cls = '') {
  closeSheet();
  const root = $('#overlay-root');
  root.innerHTML = `<div class="overlay" id="overlay"><div class="sheet ${cls}" role="dialog" aria-modal="true">${html}</div></div>`;
  $('#overlay').addEventListener('click', e => { if (e.target.id === 'overlay') closeSheet(); });
  root.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  return $('.sheet', root);
}
function closeSheet() {
  if (sheetCleanup) { const f = sheetCleanup; sheetCleanup = null; f(); }
  $('#overlay-root').innerHTML = '';
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#overlay')) closeSheet(); });
const sheetHead = title => `<div class="sheet-head"><h3>${esc(title)}</h3><button class="icon-btn" type="button" data-close aria-label="Close">${ICON.close}</button></div>`;

function confirmSheet(title, body, okLabel, onOk, danger) {
  const el = openSheet(`${sheetHead(title)}<p>${esc(body)}</p><div class="form-err" id="cf-err"></div>
    <div class="form-actions"><button class="btn" type="button" data-close>Cancel</button><button class="btn ${danger ? 'danger' : 'dark'}" type="button" id="cf-ok">${esc(okLabel)}</button></div>`);
  el.querySelectorAll('[data-close]').forEach(b => b.onclick = closeSheet);
  $('#cf-ok').onclick = async () => {
    const b = $('#cf-ok'); b.disabled = true;
    try { await onOk(); closeSheet(); } catch (e) { $('#cf-err').textContent = e.message; b.disabled = false; }
  };
}

// ───────── camera ─────────
async function startCamera(elId, onText) {
  const el = document.getElementById(elId);
  if (typeof Html5Qrcode === 'undefined') { el.innerHTML = '<div class="cam-msg">Camera scanner didn\'t load. Type the coil ID instead.</div>'; return null; }
  const cam = new Html5Qrcode(elId, { verbose: false });
  let busy = false;
  try {
    await cam.start({ facingMode: 'environment' },
      { fps: 10, qrbox: (w, h) => { const s = Math.floor(Math.min(w, h) * 0.72); return { width: s, height: s }; } },
      text => { if (busy) return; busy = true; try { cam.pause(true); } catch (e) { /* ignore */ } onText(text); },
      () => {});
  } catch (e) {
    el.innerHTML = '<div class="cam-msg">Camera isn\'t available. Check camera permission for this site, or type the coil ID below.</div>';
    return null;
  }
  return {
    resume() { busy = false; try { cam.resume(); } catch (e) { /* ignore */ } },
    async stop() { try { if (cam.isScanning) await cam.stop(); cam.clear(); } catch (e) { /* ignore */ } },
  };
}

// ───────── scan out ─────────
async function openScan() {
  openSheet(`${sheetHead('Scan out coil')}
    <div id="reader"></div>
    <label class="lbl" for="manual-id">Camera not working? Type the coil ID</label>
    <form class="manual" id="manual-form" autocomplete="off">
      <input id="manual-id" autocapitalize="characters" spellcheck="false" placeholder="Coil ID">
      <button class="btn yellow" type="submit">Find</button>
    </form>
    <div id="scan-result" aria-live="polite"></div>`, 'scan-sheet');
  let cam = null;
  sheetCleanup = () => { if (cam) cam.stop(); };
  $('#manual-form').onsubmit = e => { e.preventDefault(); const v = $('#manual-id').value.trim(); if (v) lookup(v); };
  cam = await startCamera('reader', text => lookup(text));
  if (!$('#reader')) { if (cam) cam.stop(); return; }

  async function lookup(raw) {
    const box = $('#scan-result');
    if (!box) return;
    box.innerHTML = '<div class="result"><p>Looking up coil…</p></div>';
    let matches = findLocal(raw);
    if (!matches.length) {
      try { matches = (await api('findCoil', { query: raw })).matches; } catch (e) { box.innerHTML = warnCard(e.message); return; }
    }
    const shown = raw.indexOf(QR_PREFIX) === 0 ? raw.split('|').pop() : raw;
    if (!matches.length) { box.innerHTML = warnCard(`No coil with ID "${esc(shown)}" is in the system. Check the number, or ask an admin to sign it in.`); return bindAgain(); }
    const live = matches.filter(c => c.status === 'In stock');
    if (!live.length) {
      const c = matches[0];
      box.innerHTML = warnCard(`Coil <b>${esc(c.coilId)}</b> was already scanned out by <b>${esc(c.scannedOutBy)}</b> on ${fmtDate(c.scannedOutAt, true)}.`);
      return bindAgain();
    }
    if (live.length > 1) {
      box.innerHTML = `<div class="result"><p>More than one coil has this ID. Which one is it?</p>${live.map(c => `<button class="btn choice" type="button" data-pick="${esc(c.key)}">${esc(c.supplier)}: ${c.width} mm × ${bmt(c.thickness)} BMT, ${kg(c.weight)}</button>`).join('')}</div>`;
      box.querySelectorAll('[data-pick]').forEach(b => b.onclick = () => confirmOut(live.find(c => c.key === b.dataset.pick)));
      return;
    }
    confirmOut(live[0]);
  }
  function confirmOut(c) {
    const box = $('#scan-result');
    box.innerHTML = `<div class="result">
      <div class="rid">${esc(c.coilId)}</div>
      <div class="rspec">${c.width} mm × ${bmt(c.thickness)} BMT, ${kg(c.weight)}</div>
      <p>${esc(c.supplier)}${c.consignment ? ', consignment' : ''}. Grade ${esc(c.grade)}.</p>
      <div class="form-actions"><button class="btn" type="button" id="scan-other">Scan a different coil</button><button class="btn yellow" type="button" id="do-out">Scan out coil</button></div>
      <div class="form-err" id="out-err"></div></div>`;
    box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    $('#scan-other').onclick = again;
    $('#do-out').onclick = async () => {
      const b = $('#do-out'); b.disabled = true; b.textContent = 'Scanning out…';
      try {
        const upd = await api('scanOut', { key: c.key });
        upsertCoil(upd);
        if (S.tab === 'stock') renderStock();
        box.innerHTML = `<div class="result done"><div class="done-mark">Scanned out</div><div class="rid">${esc(upd.coilId)}</div>
          <p>${upd.width} mm × ${bmt(upd.thickness)} BMT, ${kg(upd.weight)}. Recorded against ${esc(upd.scannedOutBy)}.</p>
          <div class="form-actions"><button class="btn" type="button" data-close>Done</button><button class="btn yellow" type="button" id="scan-next">Scan another</button></div></div>`;
        box.querySelector('[data-close]').onclick = closeSheet;
        $('#scan-next').onclick = again;
        if (navigator.vibrate) navigator.vibrate(60);
      } catch (e) { $('#out-err').textContent = e.message; b.disabled = false; b.textContent = 'Scan out coil'; }
    };
  }
  function warnCard(html) {
    return `<div class="result warn"><p style="color:var(--ink)">${html}</p><div class="form-actions"><button class="btn yellow" type="button" id="scan-again">Try again</button></div></div>`;
  }
  function bindAgain() { const b = $('#scan-again'); if (b) b.onclick = again; }
  function again() { $('#scan-result').innerHTML = ''; $('#manual-id').value = ''; if (cam) cam.resume(); }
}

function findLocal(raw) {
  const t = String(raw).trim();
  if (t.toUpperCase().indexOf(QR_PREFIX) === 0) {
    const key = normKey(t.slice(QR_PREFIX.length));
    return S.coils.filter(c => c.key === key);
  }
  return S.coils.filter(c => normId(c.coilId) === normId(t));
}

// ───────── sign in / edit coil ─────────
function openCoilForm(coil) {
  const editing = !!coil;
  const c = coil || { supplier: (S.suppliers[0] || {}).name || '', consignment: (S.suppliers[0] || {}).consignment || false, grade: CFG.DEFAULT_GRADE, width: '', thickness: '', weight: '', coilId: '', notes: '' };
  const supOpts = S.suppliers.map(s => `<option ${s.name === c.supplier ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const chips = (name, vals, cur, unit, fmt) => vals.map(v => `<label><input type="radio" name="${name}" value="${v}" ${Number(cur) === Number(v) ? 'checked' : ''}><span>${fmt ? fmt(v) : v}<small>${unit}</small></span></label>`).join('');
  openSheet(`${sheetHead(editing ? 'Edit coil ' + c.coilId : 'Sign in coil')}
    <form class="form" id="coil-form" autocomplete="off" novalidate>
      <label class="field"><span>Supplier</span>
        <select name="supplier" id="f-supplier">${supOpts}${isAdmin() ? '<option value="__new">Add a new supplier…</option>' : ''}</select>
      </label>
      <div class="inline-add hidden" id="new-sup">
        <label class="field"><span>New supplier name</span><input id="ns-name"></label>
        <label class="toggle"><input type="checkbox" id="ns-cons"> Their steel is on consignment</label>
        <button class="btn dark" type="button" id="ns-add">Add supplier</button>
      </div>
      <label class="toggle"><input type="checkbox" name="consignment" id="f-cons" ${c.consignment ? 'checked' : ''}> Consignment stock</label>
      <label class="field"><span>Supplier coil ID</span>
        <div class="with-btn"><input class="big-id" name="coilId" id="f-id" value="${esc(c.coilId)}" autocapitalize="characters" spellcheck="false" required>
        <button class="btn" type="button" id="scan-tag">${ICON.scan}<span>Scan tag</span></button></div>
      </label>
      <div class="reader hidden" id="tag-reader"></div>
      <div class="field"><span class="fieldset-label" id="w-l">Width</span><div class="chips" style="--n:${CFG.WIDTHS.length}" role="radiogroup" aria-labelledby="w-l">${chips('width', CFG.WIDTHS, c.width, 'mm')}</div></div>
      <div class="field"><span class="fieldset-label" id="t-l">Thickness</span><div class="chips" style="--n:${CFG.THICKNESSES.length}" role="radiogroup" aria-labelledby="t-l">${chips('thickness', CFG.THICKNESSES, c.thickness, 'BMT', bmt)}</div></div>
      <div class="row2">
        <label class="field"><span>Weight (kg)</span><input name="weight" id="f-kg" inputmode="decimal" value="${esc(c.weight)}" required></label>
        <label class="field"><span>Grade</span><input name="grade" value="${esc(c.grade || CFG.DEFAULT_GRADE)}"></label>
      </div>
      <label class="field"><span>Notes (optional)</span><input name="notes" value="${esc(c.notes)}"></label>
      ${!editing ? `<label class="toggle"><input type="checkbox" id="f-print" ${isDesk() ? 'checked' : ''}> Print the label now</label>` : ''}
      <div class="form-err" id="coil-err"></div>
      <div class="form-actions">
        ${editing && c.status === 'In stock' ? '<button class="btn danger" type="button" id="del-coil">Delete coil</button>' : ''}
        <button class="btn yellow big" type="submit">${editing ? 'Save changes' : 'Sign in coil'}</button>
      </div>
    </form>`);

  let tagCam = null;
  sheetCleanup = () => { if (tagCam) tagCam.stop(); };
  const sel = $('#f-supplier');
  let prevSup = sel.value;
  sel.onchange = () => {
    if (sel.value === '__new') { $('#new-sup').classList.remove('hidden'); $('#ns-name').focus(); return; }
    $('#new-sup').classList.add('hidden'); prevSup = sel.value;
    const s = S.suppliers.find(x => x.name === sel.value);
    if (s && !editing) $('#f-cons').checked = s.consignment;
  };
  $('#ns-add').onclick = async () => {
    const name = $('#ns-name').value.trim();
    if (!name) { $('#coil-err').textContent = 'Enter the supplier name.'; return; }
    try {
      S.suppliers = await api('addSupplier', { name, consignment: $('#ns-cons').checked });
      sel.innerHTML = S.suppliers.map(s => `<option ${s.name === name ? 'selected' : ''}>${esc(s.name)}</option>`).join('') + '<option value="__new">Add a new supplier…</option>';
      $('#f-cons').checked = $('#ns-cons').checked; prevSup = name;
      $('#new-sup').classList.add('hidden'); $('#coil-err').textContent = '';
      toast(name + ' added.');
    } catch (e) { $('#coil-err').textContent = e.message; }
  };
  $('#scan-tag').onclick = async () => {
    const r = $('#tag-reader');
    if (tagCam) { await tagCam.stop(); tagCam = null; r.classList.add('hidden'); return; }
    r.classList.remove('hidden');
    tagCam = await startCamera('tag-reader', async text => {
      $('#f-id').value = text.indexOf(QR_PREFIX) === 0 ? text.split('|').pop() : text.trim();
      if (tagCam) await tagCam.stop(); tagCam = null; r.classList.add('hidden'); r.innerHTML = '';
      $('#f-kg').focus();
    });
  };
  if ($('#del-coil')) $('#del-coil').onclick = () => confirmSheet('Delete coil ' + c.coilId + '?', 'This removes it from the system completely. Only do this if it was signed in by mistake.', 'Delete coil', async () => {
    await api('deleteCoil', { key: c.key });
    S.coils = S.coils.filter(x => x.key !== c.key); renderStock(); toast('Coil ' + c.coilId + ' deleted.');
  }, true);

  $('#coil-form').onsubmit = async ev => {
    ev.preventDefault();
    const fd = new FormData(ev.target);
    const data = {
      supplier: sel.value === '__new' ? prevSup : sel.value, coilId: (fd.get('coilId') || '').trim(),
      consignment: $('#f-cons').checked, width: fd.get('width'), thickness: fd.get('thickness'),
      weight: (fd.get('weight') || '').trim(), grade: (fd.get('grade') || '').trim(), notes: (fd.get('notes') || '').trim(),
    };
    const err = !data.coilId ? 'Enter the coil ID from the supplier tag.' : !data.width ? 'Pick the coil width.' : !data.thickness ? 'Pick the thickness.' : !(Number(String(data.weight).replace(/,/g, '')) > 0) ? 'Enter the coil weight in kg.' : '';
    if (err) { $('#coil-err').textContent = err; return; }
    const btn = ev.target.querySelector('[type=submit]'); btn.disabled = true;
    try {
      const printNow = !editing && $('#f-print') && $('#f-print').checked;
      const saved = editing ? await api('updateCoil', Object.assign({ key: c.key }, data)) : await api('signIn', data);
      if (editing && saved.key !== c.key) S.coils = S.coils.filter(x => x.key !== c.key);
      upsertCoil(saved);
      closeSheet();
      if (S.tab === 'stock') renderStock();
      if (printNow) printLabels([saved]);
      else if (!editing) toast('Coil ' + saved.coilId + ' signed in.', { action: 'Sign in another', onAction: () => openCoilForm() });
      else toast('Coil ' + saved.coilId + ' updated.');
    } catch (e) { $('#coil-err').textContent = e.message; btn.disabled = false; }
  };
  if (!editing) setTimeout(() => $('#f-id') && isDesk() && $('#f-id').focus(), 50);
}

// ───────── labels (Brother QL-800, DK-11209 62 × 29 mm) ─────────
function labelHtml(coils) {
  const one = c => {
    const qr = qrcode(0, 'M');
    qr.addData(QR_PREFIX + c.key);
    qr.make();
    const svg = qr.createSvgTag({ cellSize: 2, margin: 4, scalable: true });

      <div class="id" style="font-size:${idSize}pt">${esc(c.coilId)}</div>

      <div class="kg">${kg(c.weight)}</div>
      <div class="sup">${esc(c.supplier)}${c.consignment ? ' (consignment)' : ''}</div></div></div>`;
  };
  return `<!DOCTYPE html><html><head><meta charset="utf-8"><title>Coil labels</title>

        overflow: hidden; page-break-after: always; break-after: page; font-family: 'Barlow Condensed', 'Arial Narrow', Arial, sans-serif; color: #000; }
      .label:last-child { page-break-after: auto; break-after: auto; }

      .id { font-weight: 700; white-space: nowrap; overflow: hidden; letter-spacing: .01em; }
      .spec, .kg { font-weight: 700; font-size: 10.5pt; white-space: nowrap; }

    </style></head><body>${coils.map(one).join('')}

// Push a used coil into next month's usage (e.g. the supplier did their consignment check early), or move it back
function moveMonthBtn(c, isCurrent) {
  const style = 'style="height:36px;padding:0 12px;font-size:14px;white-space:nowrap"';
  if (c.countsIn) return `<button class="btn" type="button" data-unpush="${esc(c.key)}" ${style}>Move back</button>`;
  if (isCurrent) return `<button class="btn" type="button" data-push="${esc(c.key)}" ${style}>Push to next month</button>`;
  return '';
}
function moveCoilMonth(push, key) {
  const c = S.report && S.report.used.find(x => x.key === key); if (!c) return;
  const from = monthLong(S.reportMonth), to = monthLong(nextMonthKey(monthKey(new Date(c.scannedOutAt))));
  const title = push ? `Push coil ${c.coilId} to ${to}?` : `Move coil ${c.coilId} back to ${monthLong(monthKey(new Date(c.scannedOutAt)))}?`;
  const body = push
    ? `It keeps its real scan-out date, but counts in ${to} usage instead of ${from}. It comes off ${from}'s usage and statement and shows as still in stock at the end of ${from}.`
    : `It goes back to counting in the month it was actually scanned out.`;
  confirmSheet(title, body, push ? 'Push to ' + to : 'Move back', async () => {
    const upd = await api('setCountsIn', { key, push });
    if (upd.countsIn && upd.countsIn !== S.month) S.coils = S.coils.filter(x => x.key !== upd.key); else upsertCoil(upd);
    S.months = null; S.report = null;
    renderMonthly();
    toast(push ? `Coil ${upd.coilId} pushed to ${to}.` : `Coil ${upd.coilId} moved back.`);
  });
}

// Consignment is priced per size, so weights are only totalled within the same width × thickness
function consSizeTable(b, isCurrent) {
  const sizes = {};
  const add = (c, field) => {
    const k = c.width + '|' + bmt(c.thickness);
    sizes[k] = sizes[k] || { width: c.width, thickness: c.thickness, usedN: 0, usedKg: 0, stockN: 0, stockKg: 0 };
    sizes[k][field + 'N']++; sizes[k][field + 'Kg'] += c.weight;
  };
  b.used.forEach(c => add(c, 'used'));
  b.stock.forEach(c => add(c, 'stock'));
  const rows = Object.values(sizes).sort((x, y) => x.width - y.width || x.thickness - y.thickness);
  if (!rows.length) return '<p class="sec-sub">No consignment coils this month.</p>';
  const cell = (n, w) => n ? `${kg(w)} <span class="cell-sub">(${plural(n, 'coil')})</span>` : '<span class="cell-sub">none</span>';
  return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Size</th><th class="n">Used, to invoice</th><th class="n">${isCurrent ? 'In stock now' : 'In stock at month end'}</th></tr></thead><tbody>
    ${rows.map(r => `<tr><td><b>${r.width} × ${bmt(r.thickness)}</b></td><td class="n">${cell(r.usedN, r.usedKg)}</td><td class="n">${cell(r.stockN, r.stockKg)}</td></tr>`).join('')}
    </tbody></table></div><p></p>`;
}

async function downloadPdf(btn, type, supplier) {
  if (DEMO) { toast('PDFs are made by Google once the app is connected. In demo mode there\'s nothing to save yet.'); return; }
  const label = btn.textContent; btn.disabled = true; btn.textContent = 'Making PDF…';
  try {
    const r = await api('makePdf', { month: S.reportMonth, type, supplier });
    const bytes = Uint8Array.from(atob(r.base64), ch => ch.charCodeAt(0));
    const url = URL.createObjectURL(new Blob([bytes], { type: 'application/pdf' }));
    const a = document.createElement('a'); a.href = url; a.download = r.name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 30000);
    toast('Downloaded and saved to Drive: ' + r.name);
    S.report = null; renderMonthly();
  } catch (e) { toast(e.message, { error: true }); }
  finally { btn.disabled = false; btn.textContent = label; }
}

// ───────── demo mode (no Google connection yet) ─────────
function demoApi(action, req) {
  const KEY = 'chct_demo_db';
  let db = store.get(KEY);
  if (!db) db = demoSeed();
  const save = () => store.set(KEY, db);
  const ok = data => { save(); return { ok: true, data: JSON.parse(JSON.stringify(data)) }; };
  const fail = (error, code) => ({ ok: false, error, code });
  const me = db.crew.find(p => p.name === req.token && p.active);
  const needUser = () => !me ? fail('Please sign in again.', 'signed_out') : null;
  const needAdmin = () => needUser() || (me.role !== 'Admin' ? fail('Only admins can do that.', 'forbidden') : null);
  const crewList = () => db.crew.map(p => ({ name: p.name, role: p.role, active: p.active, locked: false }));
  const mkKey = (s, id) => normKey(s + '|' + id);
  const clean = r => {
    const w = Number(String(r.weight).replace(/,/g, ''));
    if (!r.coilId) return 'Enter the coil ID from the supplier tag.';
    if (!(Number(r.width) > 0)) return 'Pick the coil width.';
    if (!(Number(r.thickness) > 0)) return 'Pick the thickness.';
    if (!(w > 0)) return 'Enter the coil weight in kg.';
    return { supplier: r.supplier, coilId: r.coilId.trim(), consignment: !!r.consignment, width: Number(r.width), thickness: Number(r.thickness), weight: w, grade: r.grade || CFG.DEFAULT_GRADE, notes: r.notes || '' };
  };
  let e;
  switch (action) {
    case 'crewNames': return ok(db.crew.filter(p => p.active).map(p => p.name).sort());
    case 'login': {
      const p = db.crew.find(x => x.name === req.name && x.active);
      if (!p) return fail('That name isn\'t on the crew list. Ask an admin to add you.');
      if (p.pin !== req.pin) return fail('That PIN didn\'t match.');
      return ok({ token: p.name, user: { name: p.name, role: p.role } });
    }
    case 'bootstrap': {
      if ((e = needUser())) return e;
      const mk = monthKey(new Date());
      return ok({ user: { name: me.name, role: me.role }, suppliers: db.suppliers, month: mk,
        coils: db.coils.filter(c => c.status === 'In stock' || (c.scannedOutAt && effMonth(c) === mk)) });
    }
    case 'findCoil': {
      if ((e = needUser())) return e;
      const q = String(req.query || '');
      return ok({ matches: db.coils.filter(c => q.toUpperCase().indexOf(QR_PREFIX) === 0 ? c.key === normKey(q.slice(4)) : normId(c.coilId) === normId(q)) });
    }
    case 'scanOut': {
      if ((e = needUser())) return e;
      const c = db.coils.find(x => x.key === req.key);
      if (!c) return fail('That coil isn\'t in the system any more. Refresh the list.');
      if (c.status !== 'In stock') return fail('Coil ' + c.coilId + ' was already scanned out by ' + c.scannedOutBy + '.');
      Object.assign(c, { status: 'Used', scannedOutAt: new Date().toISOString(), scannedOutBy: me.name, countsIn: '' });
      return ok(c);
    }
    case 'signIn': {
      if ((e = needAdmin())) return e;
      const f = clean(req); if (typeof f === 'string') return fail(f);
      const key = mkKey(f.supplier, f.coilId);
      if (db.coils.some(c => c.key === key)) return fail('Coil ' + f.coilId + ' from ' + f.supplier + ' is already in the system.');
      const c = Object.assign({ key, status: 'In stock', signedInAt: new Date().toISOString(), signedInBy: me.name, scannedOutAt: '', scannedOutBy: '', labelsPrinted: 0 }, f);
      db.coils.unshift(c); return ok(c);
    }
    case 'updateCoil': {
      if ((e = needAdmin())) return e;
      const c = db.coils.find(x => x.key === req.key); if (!c) return fail('Coil not found.');
      const f = clean(req); if (typeof f === 'string') return fail(f);
      const key = mkKey(f.supplier, f.coilId);
      if (key !== c.key && db.coils.some(x => x.key === key)) return fail('Coil ' + f.coilId + ' from ' + f.supplier + ' is already in the system.');
      Object.assign(c, f, { key }); return ok(c);
    }
    case 'returnToStock': {
      if ((e = needAdmin())) return e;
      const c = db.coils.find(x => x.key === req.key); Object.assign(c, { status: 'In stock', scannedOutAt: '', scannedOutBy: '', countsIn: '' }); return ok(c);
    }
    case 'setCountsIn': {
      if ((e = needAdmin())) return e;
      const c = db.coils.find(x => x.key === req.key); if (!c) return fail('Coil not found.');
      if (c.status !== 'Used' || !c.scannedOutAt) return fail('Only coils that have been scanned out can be moved between months.');
      c.countsIn = req.push ? nextMonthKey(monthKey(new Date(c.scannedOutAt))) : ''; return ok(c);
    }
    case 'deleteCoil': {
      if ((e = needAdmin())) return e;
      db.coils = db.coils.filter(x => x.key !== req.key); return ok({ deleted: req.key });
    }
    case 'markPrinted': {
      if ((e = needAdmin())) return e;
      const out = db.coils.filter(c => req.keys.includes(c.key)); out.forEach(c => { c.labelsPrinted = (c.labelsPrinted || 0) + 1; }); return ok(out);
    }
    case 'addSupplier': {
      if ((e = needAdmin())) return e;
      if (!req.name) return fail('Enter the supplier name.');
      if (db.suppliers.some(s => s.name.toUpperCase() === req.name.toUpperCase())) return fail(req.name + ' is already on the list.');
      db.suppliers.push({ name: req.name, consignment: !!req.consignment }); return ok(db.suppliers);
    }
    case 'updateSupplier': {
      if ((e = needAdmin())) return e;
      const s = db.suppliers.find(x => x.name === req.name); s.consignment = !!req.consignment; return ok(db.suppliers);
    }
    case 'listCrew': if ((e = needAdmin())) return e; return ok(crewList());
    case 'addCrew': {
      if ((e = needAdmin())) return e;
      if (db.crew.some(p => p.name.toLowerCase() === req.name.toLowerCase())) return fail(req.name + ' is already on the crew list.');
      db.crew.push({ name: req.name, pin: req.pin, role: req.role === 'Admin' ? 'Admin' : 'Worker', active: true }); return ok(crewList());
    }
    case 'updateCrew': {
      if ((e = needAdmin())) return e;
      const p = db.crew.find(x => x.name === req.name);
      const admins = db.crew.filter(x => x.role === 'Admin' && x.active).length;
      if ((req.role === 'Worker' || req.active === false) && p.role === 'Admin' && p.active && admins <= 1) return fail('You need at least one admin.');
      if (req.role) p.role = req.role; if (typeof req.active === 'boolean') p.active = req.active; if (req.pin) p.pin = req.pin;
      return ok(crewList());
    }
    case 'months': {
      if ((e = needAdmin())) return e;
      const set = new Set([monthKey(new Date())]);
      db.coils.forEach(c => { if (c.scannedOutAt) set.add(effMonth(c)); });
      return ok([...set].sort().reverse().map(k => ({ key: k, label: new Date(k + '-15T00:00:00').toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' }) })));
    }
    case 'monthReport': {
      if ((e = needAdmin())) return e;
      const mk = req.month;
      const sum = l => l.reduce((t, c) => t + c.weight, 0);
      const used = db.coils.filter(c => c.status === 'Used' && effMonth(c) === mk).sort((a, b) => a.scannedOutAt.localeCompare(b.scannedOutAt));
      const stock = db.coils.filter(c => monthKey(new Date(c.signedInAt)) <= mk && (c.status === 'In stock' || effMonth(c) > mk));
      const spec = {};
      used.forEach(c => { const k = [c.supplier, c.width, c.thickness].join('|'); spec[k] = spec[k] || { supplier: c.supplier, width: c.width, thickness: c.thickness, count: 0, kg: 0 }; spec[k].count++; spec[k].kg += c.weight; });
      const consNames = new Set(db.suppliers.filter(s => s.consignment).map(s => s.name));
      used.concat(stock).filter(c => c.consignment).forEach(c => consNames.add(c.supplier));
      const consignment = [...consNames].sort().map(n => {
        const u = used.filter(c => c.consignment && c.supplier === n), s = stock.filter(c => c.consignment && c.supplier === n);
        return { supplier: n, used: u, usedKg: sum(u), stock: s, stockKg: sum(s) };
      });
      const label = new Date(mk + '-15T00:00:00').toLocaleDateString('en-NZ', { month: 'long', year: 'numeric' });
      return ok({ month: mk, label, used, usedKg: sum(used), bySpec: Object.values(spec), consignment, files: [] });
    }
    default: return fail('Not available in demo mode.');
  }
}

function demoSeed() {
  const now = Date.now(), day = 864e5;
  const sup = [{ name: 'Steel & Tube', consignment: true }, { name: 'Fletcher Steel', consignment: false }];
  const mk = (supplier, coilId, width, thickness, weight, daysAgo, outDaysAgo, by) => ({
    key: normKey(supplier + '|' + coilId), coilId, supplier, consignment: supplier === 'Steel & Tube', grade: 'G550', width, thickness, weight,
    status: outDaysAgo == null ? 'In stock' : 'Used', signedInAt: new Date(now - daysAgo * day).toISOString(), signedInBy: 'Demo Admin',
    scannedOutAt: outDaysAgo == null ? '' : new Date(now - outDaysAgo * day).toISOString(), scannedOutBy: by || '', labelsPrinted: daysAgo > 1 ? 1 : 0, notes: '',
  });
  const coils = [
    mk('Steel & Tube', '7731045', 166, 0.75, 2380, 20), mk('Steel & Tube', '7731046', 166, 0.75, 2410, 20),
    mk('Steel & Tube', '7731102', 188, 0.95, 2960, 14), mk('Steel & Tube', '7731103', 188, 0.95, 2915, 14, 3, 'Demo Worker'),
    mk('Steel & Tube', '7731220', 135, 0.55, 1650, 9), mk('Steel & Tube', '7731221', 135, 0.55, 1630, 9, 1, 'Demo Worker'),
    mk('Steel & Tube', '7731310', 166, 1.15, 3120, 0), mk('Steel & Tube', '7730987', 166, 0.75, 2400, 40, 2, 'Demo Worker'),
    mk('Fletcher Steel', 'FS-55120', 188, 0.75, 2550, 25), mk('Fletcher Steel', 'FS-55121', 135, 0.95, 1880, 6, 0, 'Demo Admin'),

}

// ───────── start ─────────
async function start() {
  if (S.token && S.user) {
    $('#app').innerHTML = '<div class="loading">Loading coils…</div>';
    try { await loadAll(true); renderApp(); } catch (e) { /* signed out → login shown */ }
    if (!S.lastLoad && S.user) renderApp();
  } else {
    renderLogin();
  }
}
// keep everyone's list live: refresh when the app comes back on screen, and every minute while open
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && S.user && Date.now() - S.lastLoad > 20000 && !$('#overlay')) refreshCurrent();
});
setInterval(() => {
  if (document.visibilityState === 'visible' && S.user && S.tab === 'stock' && !$('#overlay') && !S.loading && document.activeElement?.id !== 'search') refreshCurrent();
}, 60000);
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
start();
